plugins { id 'com.android.application' }
def defaultServiceUrl = 'https://script.google.com/macros/s/AKfycbx7PPZGfl9VTevOHnWhoYchI2UMAiqP_8gUcmxbIdkPPZ_gQNKoKEbnIF5ON8XotM_j/exec'
def configUrl = 'https://lehuynhanhtu-prog.github.io/so-xe-to-chuc/android-service-config.json'
def configPublicKey = file('../service-config-public-key.b64').text.trim()
if (!(defaultServiceUrl ==~ /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/)) throw new GradleException('Invalid bootstrap Apps Script URL')
if (!(configPublicKey ==~ /^[A-Za-z0-9+\/=]+$/)) throw new GradleException('Invalid service-config public key')
android {
    namespace 'vn.soxe.organization'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.soxe.organization'
        minSdk 24
        targetSdk 35
        versionCode 486
        versionName '4.8.4'
        buildConfigField 'String', 'SO_XE_SERVICE_URL', '"' + defaultServiceUrl + '"'
        buildConfigField 'String', 'SO_XE_CONFIG_URL', '"' + configUrl + '"'
        buildConfigField 'String', 'SO_XE_CONFIG_PUBLIC_KEY', '"' + configPublicKey + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.biometric:biometric:1.1.0'
}
// Build a local runtime, with no Web UI, from the same audited ledger core.
def coreAssets = tasks.register('packageLedgerCore', Exec) {
    workingDir rootDir.parentFile
    commandLine 'node', 'tools/build-native-core.mjs'
    inputs.files(fileTree('../../web') { include '*.mjs' })
    inputs.file('src/main/assets/native-engine.mjs')
    inputs.file('../../tools/build-native-core.mjs')
    outputs.file(layout.buildDirectory.file('generated/ledgerAssets/native-runtime.js'))
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/ledgerAssets'))
tasks.named('preBuild').configure { dependsOn(coreAssets) }
