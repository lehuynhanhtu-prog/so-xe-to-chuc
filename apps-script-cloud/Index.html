    }
  }
  function createUser() {
    openModal("T\u1EA1o t\xE0i kho\u1EA3n NSD", '<label>H\u1ECD t\xEAn</label><input name="name" required><label>T\xEAn \u0111\u1ECBnh danh</label><input name="username" required maxlength="80" autocapitalize="none" spellcheck="false"><p class="muted">3\u201340 k\xFD t\u1EF1. Ch\u1EEF c\xF3 d\u1EA5u \u0111\u01B0\u1EE3c ch\u1EA5p nh\u1EADn; kho\u1EA3ng tr\u1EAFng \u0111\u1ED5i th\xE0nh g\u1EA1ch d\u01B0\u1EDBi. T\xEAn \u0111\u0103ng nh\u1EADp \u0111\xE3 l\u01B0u: <strong id="usernamePreview">\u2014</strong></p><label>Vai tr\xF2</label><select name="role"><option value="driver">Ng\u01B0\u1EDDi qu\u1EA3n l\xFD/l\xE1i xe</option><option value="viewer">Admin ch\u1EC9 xem</option><option value="admin">Admin b\u1ED5 sung (to\xE0n quy\u1EC1n)</option></select><label>M\u1EADt kh\u1EA9u ban \u0111\u1EA7u (g\u1EEDi ri\xEAng cho NSD)</label><input name="initialPassword" type="password" minlength="6" required autocomplete="new-password"><p class="muted">NSD b\u1EAFt bu\u1ED9c \u0111\u1ED5i m\u1EADt kh\u1EA9u l\u1EA7n \u0111\u1EA7u. NSD d\xF9ng t\xEAn \u0111\u0103ng nh\u1EADp v\xE0 m\u1EADt kh\u1EA9u ri\xEAng.</p>', async (f) => {
      const a = Object.fromEntries(f);
      a.username = normalizeUsername(a.username);
      await call("createUser", a);
      $("#status").textContent += " \xB7 \u0110\xE3 t\u1EA1o t\xE0i kho\u1EA3n. G\u1EEDi t\xEAn \u0111\u0103ng nh\u1EADp " + a.username + " v\xE0 m\u1EADt kh\u1EA9u ban \u0111\u1EA7u cho NSD.";
    });
    $("#modal [name=username]").oninput = (e) => {
      $("#usernamePreview").textContent = normalizeUsername(e.target.value) || "\u2014";
    };
  }
  function editUser(id) {
    const u = state.users.find((u2) => u2.id === id);
    openModal("S\u1EEDa NSD", '<label>H\u1ECD t\xEAn</label><input name="name" required maxlength="80" value="' + esc(u.name) + '"><label>T\xEAn \u0111\u0103ng nh\u1EADp</label><input name="username" required maxlength="80" autocapitalize="none" spellcheck="false" value="' + esc(u.username) + '"><label>Vai tr\xF2</label><input readonly value="' + esc(roles[u.role]) + '"><label>\u0110\u1EB7t l\u1EA1i m\u1EADt kh\u1EA9u \u0111\u0103ng nh\u1EADp (\u0111\u1EC3 tr\u1ED1ng n\u1EBFu gi\u1EEF nguy\xEAn)</label><input name="newPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password"><label>Nh\u1EADp l\u1EA1i m\u1EADt kh\u1EA9u m\u1EDBi</label><input name="confirmPassword" type="password" autocomplete="new-password"><p class="muted">Sau khi \u0111\u1EB7t l\u1EA1i, NSD ph\u1EA3i \u0111\u0103ng nh\u1EADp b\u1EB1ng m\u1EADt kh\u1EA9u m\u1EDBi v\xE0 \u0111\u1ED5i m\u1EADt kh\u1EA9u tr\u01B0\u1EDBc khi d\xF9ng ti\u1EBFp.</p>', async (f) => {
      if (f.get("newPassword") !== f.get("confirmPassword")) throw new Error("M\u1EADt kh\u1EA9u nh\u1EADp l\u1EA1i kh\xF4ng kh\u1EDBp.");
      await call("editUser", { id, version: u.editVersion || 0, name: f.get("name"), username: normalizeUsername(f.get("username")), newPassword: f.get("newPassword") });
    });
  }
  $("#modalForm").onsubmit = (e) => {
    e.preventDefault();
    const title = $("#modalTitle").textContent, processing = title === "Sao l\u01B0u \u0111\u1EA7y \u0111\u1EE7" ? "\u0110ang sao l\u01B0u giao d\u1ECBch v\xE0 t\u1EC7p \u0111\xEDnh k\xE8m\u2026" : title === "Ph\u1EE5c h\u1ED3i d\u1EEF li\u1EC7u" || title === "X\xE1c nh\u1EADn ph\u1EE5c h\u1ED3i" ? "\u0110ang ph\u1EE5c h\u1ED3i d\u1EEF li\u1EC7u v\xE0 t\u1EC7p \u0111\xEDnh k\xE8m\u2026" : title === "Ph\u1EE5c h\u1ED3i t\u1EEB hai Google c\u0169" ? "\u0110ang ki\u1EC3m tra b\u1EA3n sao l\u01B0u \u0111\u1EA7y \u0111\u1EE7\u2026" : title === "X\xE1c nh\u1EADn chuy\u1EC3n d\u1EEF li\u1EC7u" ? "\u0110ang chuy\u1EC3n d\u1EEF li\u1EC7u v\xE0 t\u1EC7p v\xE0o m\u1ED9t Google\u2026" : title === "Ki\u1EC3m tra b\u1EA3n sao l\u01B0u" ? "\u0110ang ki\u1EC3m tra b\u1EA3n sao l\u01B0u\u2026" : "\u0110ang x\u1EED l\xFD, vui l\xF2ng ch\u1EDD\u2026";
    busy(e.submitter, async () => {
      await modalHandler(readForm(e.target));
      $("#modal").close();
    }, "#modalError", processing);
  };
  $("#closeModal").onclick = () => $("#modal").close();
  $("#nav").onclick = (e) => {
    const b = e.target.closest("[data-tab]");
    if (b) {
      tab = b.dataset.tab;
      render();
    }
  };
  $("#reload").onclick = () => run(() => call("read"));
  $("#logout").onclick = logout;
  document.querySelector(".account-menu>.row").addEventListener("click", () => {
    document.querySelector(".account-menu").classList.remove("open");
    $("#accountMenu").setAttribute("aria-expanded", "false");
  });
  $("#accountMenu").onclick = () => {
    const menu = document.querySelector(".account-menu");
    menu.classList.toggle("open");
    $("#accountMenu").setAttribute("aria-expanded", String(menu.classList.contains("open")));
  };
  $("#biometricSettings").onclick = () => {
    openModal("\u0110\u0103ng nh\u1EADp v\xE2n tay", '<p>B\u1EADt tr\xEAn \u0111i\u1EC7n tho\u1EA1i c\xE1 nh\xE2n. Th\xF4ng tin \u0111\u0103ng nh\u1EADp \u0111\u01B0\u1EE3c m\xE3 h\xF3a b\u1EB1ng kh\xF3a sinh tr\u1EAFc h\u1ECDc, ch\u1EC9 d\xF9ng cho t\xE0i kho\u1EA3n hi\u1EC7n t\u1EA1i tr\xEAn thi\u1EBFt b\u1ECB n\xE0y.</p><label>M\u1EADt kh\u1EA9u hi\u1EC7n t\u1EA1i</label><input name="password" type="password" required autocomplete="current-password"><p class="muted">M\u1EADt kh\u1EA9u lu\xF4n c\xF3 th\u1EC3 d\xF9ng thay th\u1EBF. Khi \u0111\u1ED5i m\u1EADt kh\u1EA9u, h\xE3y b\u1EADt l\u1EA1i v\xE2n tay.</p>' + (biometrics.saved() ? '<button id="forgetBiometric" type="button" class="danger">T\u1EAFt v\xE2n tay tr\xEAn thi\u1EBFt b\u1ECB n\xE0y</button>' : ""), async (f) => {
      await service.api("verifyPassword", { password: f.get("password") });
      try {
        await biometrics.enroll({ username: state.me.username, password: f.get("password"), orgId: state.organization.id, userId: state.me.id });
      } catch (e) {
        throw new Error(biometricError(e));
      }
      $("#status").textContent = "\u0110\xE3 b\u1EADt \u0111\u0103ng nh\u1EADp v\xE2n tay tr\xEAn thi\u1EBFt b\u1ECB n\xE0y.";
    });
    $("#modalSubmit").textContent = "B\u1EADt v\xE2n tay";
    $("#forgetBiometric")?.addEventListener("click", () => {
      biometrics.forget();
      $("#modal").close();
      $("#status").textContent = "\u0110\xE3 t\u1EAFt \u0111\u0103ng nh\u1EADp v\xE2n tay tr\xEAn thi\u1EBFt b\u1ECB n\xE0y.";
    });
  };
  $("#passwordButton").onclick = () => openModal("\u0110\u1ED5i m\u1EADt kh\u1EA9u", '<label>M\u1EADt kh\u1EA9u hi\u1EC7n t\u1EA1i</label><input name="current" type="password" required autocomplete="off"><label>M\u1EADt kh\u1EA9u m\u1EDBi</label><input name="new" type="password" minlength="6" maxlength="128" required autocomplete="new-password"><label>Nh\u1EADp l\u1EA1i m\u1EADt kh\u1EA9u m\u1EDBi</label><input name="confirm" type="password" required autocomplete="new-password">', async (f) => {
    if (f.get("new") !== f.get("confirm")) throw new Error("M\u1EADt kh\u1EA9u nh\u1EADp l\u1EA1i kh\xF4ng kh\u1EDBp.");
    await call("changePassword", { currentPassword: f.get("current"), password: f.get("new") });
    biometrics.forget();
  });
  $("#content").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    if (d.viewTransaction) showReminderTransaction(d.viewTransaction);
    if (d.viewHandover) showHandover(d.viewHandover);
    if (d.editHandover) editHandover(d.editHandover);
    if (d.deleteHandover) deleteHandover(d.deleteHandover);
    if (d.carHandover) editHandover(void 0, d.carHandover);
    if (d.reminderTransaction) showReminderTransaction(d.reminderTransaction);
    if (d.costCategory) {
      const date = today(), year = Number(date.slice(0, 4)), month = Number(date.slice(5, 7));
      filters = { carId: "", category: d.costCategory, from: date.slice(0, 7) + "-01", to: new Date(Date.UTC(year, month, 0)).toISOString().slice(0, 10) };
      tab = "transactions";
      render();
    }
    if (d.editCar) editCar(d.editCar);
    if (d.assignCar) assignCar(d.assignCar);
    if (d.editTransaction) editTransaction(d.editTransaction);
    if (d.deleteTransaction) {
      const t = state.transactions.find((x) => x.id === d.deleteTransaction);
      if (confirm("X\xF3a giao d\u1ECBch v\xE0 t\u1EA5t c\u1EA3 t\u1EC7p \u0111\xEDnh k\xE8m c\u1EE7a giao d\u1ECBch?")) run(() => call("deleteTransaction", { id: t.id, version: t.version }));
    }
    if (d.deleteCar) {
      const c = state.cars.find((x) => x.id === d.deleteCar);
      openModal("X\xF3a xe " + c.plate, '<p>X\xF3a xe s\u1EBD x\xF3a giao d\u1ECBch v\xE0 t\u1EC7p \u0111\xEDnh k\xE8m li\xEAn quan.</p><label>Nh\u1EADp bi\u1EC3n s\u1ED1 \u0111\u1EC3 x\xE1c nh\u1EADn</label><input name="confirmation" required>', async (f) => call("deleteCar", { id: c.id, version: c.version, confirmation: f.get("confirmation") }));
    }
    if (d.editUser) editUser(d.editUser);
    if (d.deleteUser && confirm("X\xF3a t\xE0i kho\u1EA3n n\xE0y?")) run(() => call("deleteUser", { id: d.deleteUser }));
    if (d.file) run(async () => {
      const r = await call("attachment", { id: d.file, transactionId: d.kind === "transaction" ? d.record : void 0, carId: d.kind === "car" ? d.record : void 0 });
      await openFile(r.file, !!d.viewFile);
    });
  };
  $("#closePreview").onclick = () => $("#filePreview").close();
  $("#filePreview").addEventListener("close", () => {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = null;
    $("#filePreviewBody").replaceChildren();
  });
  initializeCloud().catch((e) => {
    gate("<h2>Kh\xF4ng k\u1EBFt n\u1ED1i \u0111\u01B0\u1EE3c d\u1ECBch v\u1EE5</h2><button id=retryCloud class=wide>Th\u1EED l\u1EA1i</button>");
    $("#retryCloud").onclick = () => initializeCloud().catch((e2) => errorAt("#gateError", e2));
    errorAt("#gateError", e);
  });
})();
</script></body></html>
