const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const admin=()=>state?.me.role==='admin',write=()=>state?.me.role!=='viewer',name=id=>state.users.find(u=>u.id===id)?.name||'—',plate=id=>state.carChoices.find(c=>c.id===id)?.plate||'—',today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function setupDateInputs(container){for(const input of container.querySelectorAll('input[type=date]')){const value=input.value;input.type='text';input.dataset.isoDate='true';input.inputMode='numeric';input.placeholder='dd/mm/yyyy';input.maxLength=10;input.pattern='[0-9]{2}/[0-9]{2}/[0-9]{4}';input.value=displayDate(value);input.setAttribute('aria-label',(input.previousElementSibling?.textContent||input.name)+' (dd/mm/yyyy)');addCalendar(input);}}
function readForm(form){const f=new FormData(form);for(const input of form.querySelectorAll('[data-iso-date]')){if(!input.disabled&&f.has(input.name))f.set(input.name,parseDate(input.value));}return f;}
function errorAt(s,e){const b=$(s);b.textContent=e.message||String(e);b.hidden=false;}
async function busy(b,fn,s='#gateError'){b.disabled=true;try{await fn();}catch(e){errorAt(s,e);}finally{b.disabled=false;}}
function gate(html){$('#app').hidden=true;$('#gate').hidden=false;$('#gateContent').innerHTML=html;$('#gateError').hidden=true;}
function readConfig(){return {...window.SO_XE_GOOGLE_CONFIG};}
function start(){if(service&&secondaryConnection?.identity){profilesGate().catch(e=>errorAt('#gateError',e));return;}gate('<h2>Chọn loại đăng nhập</h2><p>Chọn vai trò để tiếp tục.</p><button id="chooseAdmin" class="wide">ADMIN</button><button id="chooseMember" class="secondary wide">NSD — Người sử dụng</button>');$('#chooseAdmin').onclick=()=>{mode='admin';googleGate();};$('#chooseMember').onclick=()=>{mode='member';googleGate();};}
function googleGate(){gate('<h2>Đăng nhập '+(mode==='admin'?'ADMIN':'NSD')+'</h2><p>'+(mode==='admin'?'Kết nối Google lưu dữ liệu Admin, sau đó kết nối TK Google lưu dữ liệu NSD.':'Kết nối TK Google lưu dữ liệu NSD, sau đó nhập tên đăng nhập và mật khẩu riêng.')+'</p><button id="'+(mode==='admin'?'googleLogin':'memberLogin')+'" class="wide">'+(mode==='admin'?'Kết nối Google Admin':'Kết nối Google TK Google lưu dữ liệu NSD')+'</button>'+(mode==='admin'?'<button id="chooseAgain" class="secondary wide">Chọn lại loại đăng nhập</button>':''));$('#chooseAgain')?.addEventListener('click',start);$(mode==='admin'?'#googleLogin':'#memberLogin').onclick=e=>busy(e.target,async()=>{if(mode==='admin'){connection=new GoogleConnection(readConfig());await connection.initialize('',{picker:false});await connection.connect();secondaryGate();}else{secondaryConnection=new GoogleConnection(readConfig());await secondaryConnection.initialize('',{picker:false});await secondaryConnection.connect();service=new DualService(new DualDrive(null,secondaryConnection.drive,'',secondaryConnection.identity.email));await profilesGate();}});}
function secondaryGate(){gate('<h2>Kết nối TK Google lưu dữ liệu NSD</h2><p>Google lưu dữ liệu Admin: <strong>'+esc(connection.identity.email)+'</strong></p><p>Chọn Google thứ hai để lưu dữ liệu NSD. TK Google lưu dữ liệu NSD phải khác Google Admin.</p><button id="connectSecondary" class="wide">Chọn tài khoản Google TK Google lưu dữ liệu NSD</button><button id="backStart" class="secondary wide">Đăng xuất</button>');$('#backStart').onclick=disconnectGoogle;$('#connectSecondary').onclick=e=>busy(e.target,async()=>{secondaryConnection=new GoogleConnection(readConfig());await secondaryConnection.initialize('',{picker:false});await secondaryConnection.connect();service=new DualService(new DualDrive(connection.drive,secondaryConnection.drive,connection.identity.email,secondaryConnection.identity.email));await profilesGate();});}
async function profilesGate(){let profiles=await service.drive.profiles();if(mode==='admin'){profiles=profiles.concat((await service.drive.memberProfiles()).filter(p=>p.appProperties.role==='admin'));if(!profiles.length){createGate();return;}}gate('<h2>'+ (mode==='admin'?'Đăng nhập ADMIN':'Đăng nhập NSD')+'</h2><p>TK Google lưu dữ liệu NSD: '+esc(secondaryConnection.identity.email)+'</p>'+loginForm(profiles,mode==='admin'));$('#open').addEventListener('submit',e=>{e.preventDefault();const f=readForm(e.target);busy(e.submitter,async()=>accept(await (mode==='admin'?service.login(f.get('profile'),f.get('password')):service.loginNamed(f.get('username'),f.get('password'),f.get('orgId')))));});}
function loginForm(profiles,isAdmin){if(isAdmin&&!profiles.length)return '<p>Chưa có tổ chức. Tạo mới hoặc chuyển dữ liệu cũ.</p>';const orgs=[...new Map(profiles.map(p=>[p.appProperties.orgId,p.name.split(' · ').slice(1,-1).join(' · ')||p.appProperties.orgId])).entries()];return '<form id="open">'+(isAdmin?'<label>Tài khoản ADMIN</label><select name="profile">'+profiles.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select>':(orgs.length>1?'<label>Tổ chức</label><select name="orgId">'+orgs.map(([id,label])=>'<option value="'+esc(id)+'">'+esc(label)+'</option>').join('')+'</select>':'')+'<label>Tên đăng nhập</label><input name="username" required autocomplete="off" autocapitalize="none" spellcheck="false">')+'<label>Mật khẩu riêng trong app</label><input name="password" type="password" required autocomplete="current-password"><button class="wide">Đăng nhập</button></form>';}
async function memberAdminGate(){const profiles=await service.drive.memberProfiles();gate('<h2>Đăng nhập ADMIN bổ sung</h2>'+loginForm(profiles,false));$('#open').onsubmit=e=>{e.preventDefault();const f=readForm(e.target);busy(e.submitter,async()=>accept(await service.loginNamed(f.get('username'),f.get('password'),f.get('orgId'))));};}
function passwordFields(){return '<label>Mật khẩu riêng (ít nhất 6 ký tự)</label><input name="password" type="password" minlength="6" maxlength="128" required autocomplete="new-password"><label>Nhập lại mật khẩu</label><input name="confirm" type="password" required autocomplete="new-password">';}
function verify(f){if(f.get('password')!==f.get('confirm'))throw new Error('Mật khẩu nhập lại không khớp.');}
function createGate(){gate('<h2>Tạo tổ chức</h2><form id="create"><label>Tên tổ chức</label><input name="organizationName" required maxlength="120"><label>Tên Admin</label><input name="adminName" required maxlength="80">'+passwordFields()+'<button class="wide">Tạo tổ chức trên hai tài khoản</button></form>');$('#create').onsubmit=e=>{e.preventDefault();const f=readForm(e.target);busy(e.submitter,async()=>{verify(f);accept(await service.createOrganization(Object.fromEntries(f)));});};}
function firstPasswordGate(){gate('<h2>Đổi mật khẩu lần đầu</h2><p>Tài khoản '+esc(service.account.username)+'. Đặt mật khẩu riêng trước khi mở dữ liệu.</p><form id="firstPassword"><label>Mật khẩu ban đầu</label><input name="current" type="password" required>'+passwordFields()+'<button class="wide">Lưu mật khẩu và mở tài khoản</button></form>');$('#firstPassword').onsubmit=e=>{e.preventDefault();const f=readForm(e.target);busy(e.submitter,async()=>{verify(f);accept(await service.api('changePassword',{currentPassword:f.get('current'),password:f.get('password')}));});};}
function accept(r){if(r.mustChange){firstPasswordGate();return;}if(r.deletionPending){gate('<h2>Hoàn tất xóa tổ chức</h2><button id="finishDelete">Tiếp tục xóa</button>');$('#finishDelete').onclick=()=>deleteOrg(r.organizationName);return;}state=r.data;$('#gateContent').innerHTML='';$('#gate').hidden=true;$('#app').hidden=false;render();status(r);clearInterval(poll);poll=setInterval(()=>{if(!document.hidden&&!$('#modal').open){if(!sessionsValid()){$('#status').textContent='Phiên Google hết hạn. Bấm Kết nối Google.';return;}run(()=>call('read'));}},15000);}
function sessionsValid(){return secondaryConnection?.drive&&Date.now()<secondaryConnection.drive.expires&&(!service?.drive.primary||connection?.drive&&Date.now()<connection.drive.expires);}
function status(r){$('#status').textContent=(state?.pending?'Đã lưu TK Google lưu dữ liệu NSD · '+state.pending+' thao tác chờ Admin đồng bộ':'Đã đồng bộ · '+new Date().toLocaleTimeString('vi-VN'))+(r.warnings?.length?' · '+r.warnings.join(' · '):'')+(state?.conflicts?.length?' · '+state.conflicts.length+' thao tác bị từ chối; xem Tổng quan':'');}
async function call(action,args={}){const s=service;if(!['read','attachment','export','inviteUser','changePassword','deleteOrganization'].includes(action))args.operationId=($('#modal').open?operationId:null)||crypto.randomUUID();const r=await s.api(action,args);if(s!==service)return {};if(r.data){state=r.data;render();}status(r);return r;}
function clearAccount(){clearInterval(poll);clearSessionKeys();if(service){service.account=null;service.readCache.clear();}state=null;files=[];filters={carId:'',category:'',from:'',to:''};$('#modal').close();$('#modalBody').innerHTML='';$('#content').innerHTML='';tab='overview';}
function disconnectGoogle(){clearAccount();connection?.disconnect();secondaryConnection?.disconnect();connection=null;secondaryConnection=null;service=null;start();}
function logout(){const admin2=service?.account?.role==='admin'&&!service?.account?.primaryProfile,drive=service?.drive;clearAccount();if(drive&&secondaryConnection?.identity){service=new DualService(drive);(admin2?memberAdminGate():profilesGate()).catch(e=>errorAt('#gateError',e));}else disconnectGoogle();}
function render(){if(!state||state.me.mustChange)return;$('#orgName').textContent=state.organization.name;$('#identity').textContent=state.me.name+' · '+roles[state.me.role];const tabs=[['overview','Tổng quan'],['cars','Xe'],['transactions','Chi phí'],['reports','Báo cáo']];if(admin())tabs.push(['members','Người sử dụng'],['settings','Tổ chức']);if(!tabs.some(x=>x[0]===tab))tab='overview';$('#nav').innerHTML=tabs.map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+label+'</button>').join('');({overview:renderOverview,cars:renderCars,transactions:renderTransactions,reports:renderReports,members:renderMembers,settings:renderSettings}[tab])();setupDateInputs($('#content'));}
function reminderItem(r,compact=false){const t=r.transaction,expiring=['insurance','inspection','road_fee'].includes(t.category),status=expiring?(r.days<0?'ĐÃ HẾT HẠN '+Math.abs(r.days)+' ngày':r.days===0?'HẾT HẠN HÔM NAY':r.days<=45?'SẮP HẾT HẠN · còn '+r.days+' ngày':'Còn hiệu lực · còn '+r.days+' ngày'):(r.level==='expired'?'ĐÃ QUÁ HẠN':r.level==='due'?'ĐẾN HẠN':r.level==='warning'?'SẮP ĐẾN HẠN':'Kỳ tiếp theo'),schedule=expiring?'Từ '+dateVN(t.insuranceStart||t.date)+' đến '+dateVN(r.dueDate):[r.dueOdo!==null?'ODO '+Number(r.dueOdo).toLocaleString('vi-VN')+' km ('+(r.leftKm<0?'đã vượt '+Number(-r.leftKm).toLocaleString('vi-VN'):'còn '+Number(r.leftKm).toLocaleString('vi-VN'))+' km)':'',r.dueDate?'Ngày '+dateVN(r.dueDate)+(r.days<0?' (quá '+(-r.days)+' ngày)':' (còn '+r.days+' ngày)'):''].filter(Boolean).join(' hoặc ');return '<button type="button" class="vehicle-reminder '+r.level+'" data-reminder-transaction="'+esc(t.id)+'"><strong>'+(compact?'':esc(r.car.plate)+' · ')+esc(categories[t.category])+'</strong><small>Người quản lý/lái xe: '+esc(name(state.carChoices.find(c=>c.id===r.car.id)?.assignedUserId))+'</small><span class="reminder-state">'+esc(status)+'</span><span>'+esc(schedule)+'</span>'+(!expiring&&r.dueDate&&r.dueOdo!==null?'<small>Tùy điều kiện nào đến trước</small>':'')+((t.description||t.insuranceProvider||t.insurancePolicy)?'<small>'+esc([t.description,t.insuranceProvider,t.insurancePolicy?'Số: '+t.insurancePolicy:''].filter(Boolean).join(' · '))+'</small>':'')+'</button>';}
function reminderOverview(){const items=vehicleReminders(state,today()),urgent=items.filter(r=>r.urgent),groups=[['Bảo dưỡng / Phụ tùng',['maintenance','parts'],'Chưa có chu kỳ bảo dưỡng. Nhập chu kỳ km hoặc tháng để theo dõi.'],['Bảo hiểm TNDS',['insurance'],'Chưa có thông tin bảo hiểm TNDS. Nhập ngày hiệu lực và hết hạn trong chi phí.'],['Đăng kiểm / Phí đường bộ',['inspection','road_fee'],'Chưa có thông tin đăng kiểm hoặc phí đường bộ.']];return (urgent.length?'<div class="error" role="status"><strong>Cảnh báo: '+urgent.length+' khoản đã đến hạn hoặc cần xử lý trong 5 ngày</strong></div>':'')+'<div class="grid reminder-grid">'+groups.map(([title,types,empty])=>{const list=items.filter(r=>types.includes(r.transaction.category));return '<section class="card"><h2>'+title+'</h2><div class="reminder-list">'+(list.map(r=>reminderItem(r)).join('')||'<p class="muted">'+empty+'</p>')+'</div></section>';}).join('')+'</div>';}

function showReminderTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;openModal('Chi tiết giao dịch',transactionTable([t],false)+(canEditTransaction(t)?'<button type="button" id="editDetailTransaction">Sửa giao dịch</button>':''),async()=>{});$('#editDetailTransaction')?.addEventListener('click',()=>{$('#modal').close();editTransaction(t.id);});$('#modalSubmit').hidden=true;$('#modalBody').onclick=e=>{if(e.target.closest('[data-file]'))$('#content').onclick(e);};}
function renderOverview(){const summary=overviewSummary(state,today()),max=Math.max(1,...summary.months.map(m=>m.total));$('#content').innerHTML='<h2>Tổng quan chi phí</h2><p class="muted">Tháng '+summary.month.slice(5)+'/'+summary.month.slice(0,4)+' · Dữ liệu trong phạm vi được xem</p>'+(state.conflicts?.length?'<div class="error">'+state.conflicts.map(c=>esc(c.message)).join('<br>')+'</div>':'')+'<div class="grid overview-metrics">'+[['Tổng chi tháng này',money(summary.total),state.cars.length+' xe · '+state.transactions.filter(t=>t.date.startsWith(summary.month)).length+' giao dịch'],['Xăng / Sạc / Thuê pin',money(summary.energy),summary.liters.toLocaleString('vi-VN',{maximumFractionDigits:3})+' lít · '+summary.chargeCount+' lần sạc · '+summary.rentalCount+' kỳ thuê pin'],['Bảo dưỡng',money(summary.maintenance),summary.maintenanceCount+' lần']].map(([title,value,note])=>'<div class="card"><small>'+title+'</small><div class="stat">'+value+'</div><p class="muted">'+note+'</p></div>').join('')+'</div><section class="card"><div class="row spread"><h2>Tổng hợp xe tháng này</h2><strong>'+money(summary.total)+'</strong></div><div class="table-wrap"><table class="vehicle-summary"><thead><tr><th>Biển số</th><th>Tên xe</th><th>Động cơ</th><th>Chi phí tháng</th><th>ODO hiện tại</th></tr></thead><tbody>'+summary.cars.map(c=>'<tr><td><strong>'+esc(c.plate)+'</strong></td><td>'+esc(c.name)+'</td><td><span class="tag">'+esc(powerLabel(c))+'</span></td><td><strong>'+money(c.cost)+'</strong></td><td>'+c.odo.toLocaleString('vi-VN')+' km</td></tr>').join('')+'</tbody></table></div>'+(!summary.cars.length?'<p class="muted">Chưa có xe trong phạm vi quản lý.</p>':'')+'</section><div class="grid overview-panels"><section class="card"><h2>Chi phí 6 tháng gần đây</h2><div class="cost-chart" role="img" aria-label="Chi phí sáu tháng">'+summary.months.map(m=>'<div class="chart-column"><small>'+money(m.total)+'</small><div class="chart-track"><div class="chart-bar" style="height:'+Math.max(2 function renderCars(){const cards=state.cars.map(c=>{const a=state.assignments.find(x=>x.carId===c.id&&!x.endedAt),total=state.transactions.filter(t=>t.carId===c.id).reduce((s,t)=>s+t.amount,0);return '<article class="card car-card"><div class="row spread"><span class="tag">'+esc(c.plate)+'</span><span class="tag">'+esc(powerLabel(c))+'</span></div><h2>'+esc(c.name)+'</h2><p class="muted">'+esc(c.year||'Chưa nhập năm sản xuất')+' · '+esc(a?name(a.userId):'Chưa phân công')+'</p><div class="stat car-odo">'+currentOdo(state,c).toLocaleString('vi-VN')+' <small>km</small></div><p class="muted">Tổng chi phí: <strong>'+money(total)+'</strong></p>'+carReminders(c.id)+(c.attachments?.length?'<div class="car-documents"><strong>Giấy chủ quyền / Tệp xe</strong>'+fileList(c.attachments,'car',c.id)+'</div>':'')+(admin()?'<div class="actions"><button data-edit-car="'+c.id+'">Sửa xe</button><button class="secondary" data-assign-car="'+c.id+'">Phân công</button><button class="danger" data-delete-car="'+c.id+'">Xóa xe</button></div>':'')+'</article>';}).join('');$('#content').innerHTML='<div class="row spread" style="margin-bottom:18px"><h2>Xe của tôi</h2>'+(admin()?'<button id="addCar">Thêm xe</button>':'')+'</div><div class="grid car-grid">'+(cards||'<div class="empty">Chưa có xe trong phạm vi quản lý.</div>')+'</div>';$('#addCar')?.addEventListener('click',()=>editCar());}

const dateVN=d=>d?d.split('-').reverse().join('/'):'—';
function expenseDetails(t){const pairs=[['ODO',Number(t.odo||0).toLocaleString('vi-VN')+' km']];if(t.category==='fuel'){if(t.liters)pairs.push(['Số lít',t.liters+' lít']);if(t.fuelPrice)pairs.push(['Đơn giá',money(t.fuelPrice)+'/lít']);}if(t.category==='charge')pairs.push(['Pin',t.batteryFrom+'% → '+t.batteryTo+'%']);if(t.repeatKm||t.repeatMonths)pairs.push(['Chu kỳ',[t.repeatKm?t.repeatKm+' km':'',t.repeatMonths?t.repeatMonths+' tháng':''].filter(Boolean).join(' / ')]);if(t.insuranceProvider)pairs.push(['Đơn vị',t.insuranceProvider]);if(t.insurancePolicy)pairs.push(['Số hợp đồng',t.insurancePolicy]);if(t.insuranceStart||t.insuranceExpiry)pairs.push(['Hiệu lực',dateVN(t.insuranceStart)+' – '+dateVN(t.insuranceExpiry)]);return '<dl class="expense-meta">'+pairs.map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl>';}
function transactionTable(list,showActions=true){return list.length?'<div class="table-wrap"><table class="expense-table"><thead><tr><th>Ngày / Xe</th><th>Loại / Nội dung / Chi tiết</th><th>ODO</th><th>Số tiền</th><th>Người nhập</th><th>Thao tác</th></tr></thead><tbody>'+list.map(t=>'<tr class="expense-item"><td>'+dateVN(t.date)+'<br><strong>'+esc(plate(t.carId))+'</strong></td><td><span class="tag">'+esc(categories[t.category])+'</span>'+(t.description?'<p class="expense-description">'+esc(t.description)+'</p>':'')+expenseDetails(t)+(t.note?'<p class="expense-note">'+esc(t.note)+'</p>':'')+fileList(t.attachments,'transaction',t.id)+'</td><td>'+Number(t.odo||0).toLocaleString('vi-VN')+' km</td><td><strong>'+money(t.amount)+'</strong></td><td>'+esc(name(t.enteredBy))+((t.onBehalf||t.enteredBy!==t.enteredFor)?'<br><span class="behalf">Nhập hộ: '+esc(t.enteredBy!==t.enteredFor?name(t.enteredFor):'Xe '+plate(t.carId))+'</span>':'')+'</td><td>'+(showActions&&canEditTransaction(t)?'<div class="row"><button class="secondary" data-edit-transaction="'+t.id+'">Sửa</button><button class="danger" data-delete-transaction="'+t.id+'">Xóa</button></div>':'Chỉ xem')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Chưa có giao dịch phù hợp.</div>';}

function renderReports(){const list=filtered(),rows=monthlySummary(state,filters,categories);$('#content').innerHTML='<h2>Báo cáo chi phí</h2>'+filterBar()+'<div class="card"><div class="row spread"><h3>Tổng chi phí</h3><strong class="stat">'+money(list.reduce((s,t)=>s+t.amount,0))+'</strong></div><p>'+list.length+' giao dịch trong phạm vi được xem</p><div class="actions"><button id="exportTransactions">Xuất Excel giao dịch</button><button id="exportReports" class="secondary">Xuất Excel báo cáo</button></div></div>'+state.carChoices.filter(c=>rows.some(r=>r.carId===c.id)).map(c=>'<section class="card"><h2>'+esc(c.plate)+' · '+esc(c.name)+'</h2><div class="table-wrap"><table class="reporttable"><thead><tr><th>Tháng</th><th>ODO cuối kỳ</th><th>ODO giữa hai kỳ</th>'+Object.values(categories).map(v=>'<th>'+esc(v)+'</th>').join('')+'<th>Tổng</th><th>L/100 km</th></tr></thead><tbody>'+rows.filter(r=>r.carId===c.id).map(r=>'<tr><td>'+r.month.split('-').reverse().join('/')+'</td><td>'+r.closingOdo.toLocaleString('vi-VN')+' km</td><td>'+(r.distance===null?'—':r.distance.toLocaleString('vi-VN')+' km')+'</td>'+Object.keys(categories).map(k=>'<td>'+money(r.costs[k])+'</td>').join('')+'<td><strong>'+money(r.total)+'</strong></td><td>'+(r.rate===null?'—':r.rate.toFixed(2))+'</td></tr>').join('')+'</tbody></table></div></section>').join('')+'<div class="row spread"><h2>Chi tiết giao dịch</h2><button id="printReports" class="secondary">In báo cáo</button></div>'+transactionTable(list);bindFilters();$('#printReports').onclick=()=>window.print();$('#exportTransactions').onclick=()=>download(transactionsExcel(state,filters,categories),'so-xe-giao-dich-'+today()+'.xls','application/vnd.ms-excel');$('#exportReports').onclick=()=>download(reportsExcel(state,filters,categories),'so-xe-bao-cao-'+today()+'.xls','application/vnd.ms-excel');}

function openModal(title,html,handler,existingFiles=[]){operationId=crypto.randomUUID();$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalError').hidden=true;modalHandler=handler;files=existingFiles.map(f=>({...f}));$('#modalSubmit').hidden=false;$('#modalSubmit').textContent=title.startsWith('Xóa')?'Xác nhận xóa':'Lưu';setupDateInputs($('#modalBody'));$('#modal').showModal();if($('#fileInput')){$('#fileInput').onchange=async e=>{try{const additions=[];for(const f of e.target.files){if(f.size>2*1024*1024)throw new Error('Mỗi tệp tối đa 2 MB.');const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f);});additions.push({name:f.name,type:f.type,base64});}if(files.length+additions.length>5)throw new Error('Tối đa 5 tệp.');files.push(...additions);renderEditFiles();}catch(err){errorAt('#modalError',err);}finally{e.target.value='';}};renderEditFiles();}}

function editCar(id){const c=state.cars.find(x=>x.id===id)||{};openModal(id?'Sửa xe':'Thêm xe','<label>Biển số</label><input name="plate" required value="'+esc(c.plate)+'"><label>Tên xe</label><input name="name" required value="'+esc(c.name)+'"><div class="grid"><div><label>Năm sản xuất</label><input name="year" pattern="[0-9]{4}" value="'+esc(c.year)+'"></div><div><label>Loại động cơ</label><select name="powerType">'+options([{id:'fuel',label:'Xăng / Dầu'},{id:'electric',label:'Điện'},{id:'hybrid',label:'Điện – Xăng'}],c.powerType||'fuel')+'</select></div><div><label>ODO hiện tại (km)</label><input name="odo" type="number" min="0" max="10000000" value="'+(c.odo||0)+'"></div></div>'+fileEditor,async f=>call('saveCar',{id:c.id,version:c.version,plate:f.get('plate'),name:f.get('name'),year:f.get('year'),powerType:f.get('powerType'),odo:Number(f.get('odo')),attachments:files}),c.attachments||[]);}
function expenseTypeFields(){const category=$('#modalBody [name=category]').value;for(const group of $('#modalBody').querySelectorAll('[data-categories]'))group.hidden=!group.dataset.categories.split(' ').includes(category);}
function bindFuelCalculation(){const form=$('#modalBody'),amount=form.querySelector('[name=amount]'),price=form.querySelector('[name=fuelPrice]'),liters=form.querySelector('[name=liters]');let basis=Number(price.value)>0?'price':'liters';for(const [input,source] of [[amount,'amount'],[price,'price'],[liters,'liters']])input.addEventListener('input',()=>{if(form.querySelector('[name=category]').value!=='fuel')return;if(source!=='amount')basis=source;const changes=calculateFuel(amount.value,price.value,liters.value,source,basis);for(const [key,value] of Object.entries(changes))form.querySelector('[name='+key+']').value=value;});}
function canEditTransaction(t){return admin()||state.me.role==='driver'&&t.enteredBy===state.me.id;}
function bindVehicleEntry(t,selected){const car=$('#modalBody [name=carId]'),who=$('#modalBody [name=enteredFor]'),check=$('#onBehalfCheck');if(!check)return;check.checked=!!t.id&&(t.onBehalf||t.enteredFor!==t.enteredBy||!state.carChoices.some(c=>c.id===t.carId&&c.assignedUserId===state.me.id));function updateCars(){const chosen=car.value||selected,list=check.checked?state.carChoices:state.carChoices.filter(c=>c.assignedUserId===state.me.id);car.innerHTML=list.length?options(list.map(c=>({id:c.id,label:c.plate+' · '+c.name})),chosen):'<option value="">Chưa có xe được phân công</option>';who.disabled=!check.checked;if(!check.checked)who.value=state.me.id;else if(!t.id){const owner=state.carChoices.find(c=>c.id===car.value)?.assignedUserId;who.value=owner&&[...who.options].some(o=>o.value===owner)?owner:state.me.id;}who.onchange();$('#onBehalf').textContent+=' · '+(check.checked?'Nhập hộ xe '+plate(car.value):'Xe đang quản lý');}check.onchange=updateCars;car.onchange=()=>{if(check.checked){const owner=state.carChoices.find(c=>c.id===car.value)?.assignedUserId;who.value=owner&&[...who.options].some(o=>o.value===owner)?owner:state.me.id;}who.onchange();if(check.checked)$('#onBehalf').textContent+=' · Nhập hộ xe '+plate(car.value);};updateCars();}
function editTransaction(id){const t=state.transactions.find(x=>x.id===id)||{};if(id&&!canEditTransaction(t))return alert('Chỉ được sửa giao dịch do mình nhập.');const managed=state.carChoices.filter(c=>c.assignedUserId===state.me.id),selected=t.carId||(admin()?state.carChoices[0]?.id:managed[0]?.id)||'';if(!state.carChoices.length)return alert('Admin cần nhập xe trước.');const entryOptions=state.users.filter(u=>u.role==='driver'||u.id===state.me.id).map(u=>({id:u.id,label:u.name}));openModal(id?'Sửa chi phí':'Nhập chi phí',(admin()?'':'<label class="check-row"><input id="onBehalfCheck" name="onBehalf" type="checkbox"> Nhập hộ</label>')+'<div class="grid"><div><label>Xe</label><select name="carId" required>'+options(state.carChoices.map(c=>({id:c.id,label:c.plate+' · '+c.name})),selected)+'</select></div><div><label>Ngày giao dịch</label><input name="date" type="date" required value="'+(t.date||today())+'"></div><div><label>Loại chi phí</label><select name="category">'+options(Object.entries(categories).map(([id,label])=>({id,label})),t.category)+'</select></div></div><label>Nội dung chi phí</label><input name="description" maxlength="1000" value="'+esc(t.description)+'"><div class="grid"><div><label>Số tiền (đồng)</label><input name="amount" type="number" min="0" max="1000000000000" required value="'+(t.amount||0)+'"></div><div><label>ODO (km)</label><input name="odo" type="number" min="0" max="10000000" required value="'+(t.odo||0)+'"></div></div><p data-categories="fuel" class="muted">Nhập tổng tiền và đơn giá để tính số lít; nhập số lít để tính đơn giá. Tổng tiền giữ nguyên.</p><div data-categories="fuel" class="grid"><div><label>Đơn giá xăng (đồng/lít)</label><input name="fuelPrice" type="number" min="0" step="0.01" value="'+(t.fuelPrice||0)+'"></div><div><label>Số lít</label><input name="liters" type="number" min="0" step="0.001" value="'+(t.liters||0)+'"></div></div><div data-categories="charge" class="grid"><div><label>Pin trước sạc (%)</label><input name="batteryFrom" type="number" min="0" max="100" value="'+(t.batteryFrom||0)+'"></div><div><label>Pin sau sạc (%)</label><input name="batteryTo" type="number" min="0" max="100" value="'+(t.batteryTo||0)+'"></div></div><div data-categories="maintenance parts" class="grid"><div><label>Chu kỳ (km)</label><input name="repeatKm" type="number" min="0" value="'+(t.repeatKm||0)+'"></div><div><label>Chu kỳ (tháng)</label><input name="repeatMonths" type="number" min="0" value="'+(t.repeatMonths||0)+'"></div></div><div data-categories="insurance inspection road_fee"><div class="grid"><div><label>Đơn vị / Nhà cung cấp</label><input name="insuranceProvider" value="'+esc(t.insuranceProvider)+'"></div><div><label>Số hợp đồng / Số chứng nhận</label><input name="insurancePolicy" value="'+esc(t.insurancePolicy)+'"></div><div><label>Ngày hiệu lực</label><input name="insuranceStart" type="date" value="'+esc(t.insuranceStart)+'"></div><div><label>Ngày hết hạn</label><input name="insuranceExpiry" type="date" value="'+esc(t.insuranceExpiry)+'"></div></div></div><label>Người được ghi nhận chi phí</label><select name="enteredFor">'+options(entryOptions,t.enteredFor||state.me.id)+'</select><p id="onBehalf" class="notice"></p><label>Ghi chú</label><textarea name="note" maxlength="2000">'+esc(t.note)+'</textarea>'+fileEditor,async f=>{const a=Object.fromEntries(f);a.onBehalf=f.get('onBehalf')==='on';if(!a.carId)throw new Error('Chưa có xe được phân công. Bật Nhập hộ để chọn xe khác.');if(!a.enteredFor)a.enteredFor=state.me.id;for(const k of ['amount','odo','fuelPrice','liters','batteryFrom','batteryTo','repeatKm','repeatMonths'])a[k]=Number(a[k]||0);await call('saveTransaction',{...a,id:t.id,version:t.version,attachments:files});},t.attachments||[]);$('#modalBody [name=category]').onchange=expenseTypeFields;expenseTypeFields();const enteredFor=$('#modalBody [name=enteredFor]'),update=()=>{$('#onBehalf').textContent=enteredFor.value===(t.enteredBy||state.me.id)?'Người nhập: '+name(t.enteredBy||state.me.id):'Người nhập: '+name(t.enteredBy||state.me.id)+' · Nhập hộ: '+name(enteredFor.value);};enteredFor.onchange=update;update();bindVehicleEntry(t,selected);bindFuelCalculation();}
function assignCar(id){const drivers=state.users.filter(u=>u.role==='driver');if(!drivers.length)return alert('Hãy tạo tài khoản lái xe trước.');openModal('Phân công '+plate(id),'<label>Người quản lý/lái xe</label><select name="userId">'+'<option value="">Chưa phân công / Bỏ phân công</option>'+options(drivers.map(u=>({id:u.id,label:u.name})),state.assignments.find(a=>a.carId===id&&!a.endedAt)?.userId)+'</select>',async f=>call('assign',{carId:id,userId:f.get('userId')}));}
function download(content,filename,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function run(fn){$('#status').textContent='Đang xử lý…';try{await fn();}catch(e){$('#status').textContent=e.message;alert(e.message);}}
function createUser(){openModal('Tạo tài khoản NSD','<label>Họ tên</label><input name="name" required><label>Tên định danh</label><input name="username" required pattern="[a-zA-Z0-9_.-]{3,40}"><label>Vai trò</label><select name="role"><option value="driver">Người quản lý/lái xe</option><option value="viewer">Admin chỉ xem</option><option value="admin">Admin bổ sung (kết nối cả hai Google)</option></select><label>Mật khẩu ban đầu (gửi riêng cho NSD)</label><input name="initialPassword" type="password" minlength="6" required value="000000" autocomplete="new-password"><p class="muted">NSD bắt buộc đổi mật khẩu lần đầu. Tài khoản tự ghi sang TK Google lưu dữ liệu NSD.</p>',async f=>{await call('createUser',Object.fromEntries(f));$('#status').textContent+=' · Đã tạo tài khoản trên TK Google lưu dữ liệu NSD. Gửi tên định danh và mật khẩu ban đầu cho NSD.';});}
function editUser(id){const u=state.users.find(u=>u.id===id);openModal('Sửa NSD','<label>Họ tên</label><input name="name" required maxlength="80" value="'+esc(u.name)+'"><label>Tên đăng nhập</label><input name="username" required pattern="[a-zA-Z0-9_.-]{3,40}" value="'+esc(u.username)+'"><label>Vai trò</label><input readonly value="'+esc(roles[u.role])+'"><label>Đặt lại mật khẩu đăng nhập (để trống nếu giữ nguyên)</label><input name="newPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password"><label>Nhập lại mật khẩu mới</label><input name="confirmPassword" type="password" autocomplete="new-password"><p class="muted">Sau khi đặt lại, NSD phải đăng nhập bằng mật khẩu mới và đổi mật khẩu trước khi dùng tiếp.</p>',async f=>{if(f.get('newPassword')!==f.get('confirmPassword'))throw new Error('Mật khẩu nhập lại không khớp.');await call('editUser',{id,version:u.editVersion||0,name:f.get('name'),username:f.get('username'),newPassword:f.get('newPassword')});});}

$('#modalForm').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await modalHandler(readForm(e.target));$('#modal').close();},'#modalError');};$('#closeModal').onclick=()=>$('#modal').close();
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();}};
$('#reload').onclick=()=>run(()=>call('read'));$('#googleReconnect').onclick=()=>openModal('Kết nối lại Google','<p>Kết nối từng Google bằng nút bên dưới. Chọn đúng tài khoản đã đăng ký.</p>'+(service.drive.primary?'<button type="button" id="reauthorizeAdmin" class="secondary">Google dữ liệu Admin</button> ':'')+'<button type="button" id="reauthorizeMember" class="secondary">TK Google lưu dữ liệu NSD</button>',async()=>{});
$('#modalBody').addEventListener('click',e=>{if(e.target.id==='reauthorizeAdmin')busy(e.target,()=>connection.connect(),'#modalError');if(e.target.id==='reauthorizeMember')busy(e.target,()=>secondaryConnection.connect(),'#modalError');});
$('#logout').onclick=logout;
$('#passwordButton').onclick=()=>openModal('Đổi mật khẩu','<label>Mật khẩu hiện tại</label><input name="current" type="password" required autocomplete="off"><label>Mật khẩu mới</label><input name="new" type="password" minlength="6" maxlength="128" required autocomplete="new-password"><label>Nhập lại mật khẩu mới</label><input name="confirm" type="password" required autocomplete="new-password">',async f=>{if(f.get('new')!==f.get('confirm'))throw new Error('Mật khẩu nhập lại không khớp.');await call('changePassword',{currentPassword:f.get('current'),password:f.get('new')});});
$('#content').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.reminderTransaction)showReminderTransaction(d.reminderTransaction);if(d.costCategory){const date=today(),year=Number(date.slice(0,4)),month=Number(date.slice(5,7));filters={carId:'',category:d.costCategory,from:date.slice(0,7)+'-01',to:new Date(Date.UTC(year,month,0)).toISOString().slice(0,10)};tab='transactions';render();}if(d.editCar)editCar(d.editCar);if(d.assignCar)assignCar(d.assignCar);if(d.editTransaction)editTransaction(d.editTransaction);if(d.deleteTransaction){const t=state.transactions.find(x=>x.id===d.deleteTransaction);if(confirm('Xóa giao dịch và tất cả tệp đính kèm của giao dịch?'))run(()=>call('deleteTransaction',{id:t.id,version:t.version}));}if(d.deleteCar){const c=state.cars.find(x=>x.id===d.deleteCar);openModal('Xóa xe '+c.plate,'<p>Xóa xe sẽ xóa giao dịch và tệp đính kèm liên quan.</p><label>Nhập biển số để xác nhận</label><input name="confirmation" required>',async f=>call('deleteCar',{id:c.id,version:c.version,confirmation:f.get('confirmation')}));}if(d.editUser)editUser(d.editUser);if(d.deleteUser&&confirm('Xóa tài khoản này?'))run(()=>call('deleteUser',{id:d.deleteUser}));if(d.file)run(async()=>{const r=await call('attachment',{id:d.file,transactionId:d.kind==='transaction'?d.record:undefined,carId:d.kind==='car'?d.record:undefined});const bytes=Uint8Array.from(atob(r.file.base64),c=>c.charCodeAt(0));download(bytes,r.file.name,'application/octet-stream');});};
start();
</script></body></html>
