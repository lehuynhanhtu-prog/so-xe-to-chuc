<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sổ Xe Tổ Chức</title><style>body{font:16px system-ui,sans-serif;background:#f4f7fb;color:#142b43;margin:0;padding:25px}main{max-width:520px;margin:7vh auto;background:white;padding:32px;border-radius:18px;border:1px solid #dfe7ef}h1{font-size:27px}p{line-height:1.65;color:#60758a}label{display:block;font-weight:600;margin:22px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cedae4;border-radius:9px;font:inherit}button{border:0;background:#176a65;color:white;border-radius:9px;padding:13px;width:100%;margin:15px 0;font:inherit;font-weight:600}a{color:#176a65}.error{color:#a52c26}</style></head><body><main><h1>Sổ Xe Tổ Chức</h1><p>Bản web lưu dữ liệu mã hóa trên thư mục Google Drive dùng chung. Người quản lý/lái xe đăng nhập bằng tài khoản ứng dụng và file do Admin cấp.</p><form id="open"><label>Địa chỉ web app do Admin cung cấp</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" required autocomplete="off"><button>Mở ứng dụng</button><p id="error" class="error" hidden></p></form><p>Admin chưa triển khai dịch vụ? <a href="https://github.com/lehuynhanhtu-prog/so-xe-to-chuc/blob/codex/drive-service-web/apps-script/DEPLOY.md">Xem hướng dẫn triển khai</a> hoặc <a href="downloads/so-xe-drive-web.zip">tải gói web Drive</a>.</p></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));document.getElementById('open').onsubmit=e=>{e.preventDefault();const url=document.getElementById('url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(url)){const box=document.getElementById('error');box.hidden=false;box.textContent='Nhập URL triển khai Apps Script kết thúc bằng /exec.';return;}location.assign(url);};</script></body></html>
