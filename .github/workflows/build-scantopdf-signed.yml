name: Build signed ScantoPDF APK
# ScantoPDF source: 059e360c2627a28dc10a44711351f1d83fd54afd

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scantopdf-signed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scantopdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout signing repository
        uses: actions/checkout@v4

      - name: Checkout ScantoPDF source
        uses: actions/checkout@v4
        with:
          repository: lehuynhanhtu-prog/ScantoPDF-Android
          ref: main
          path: scantopdf

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate sdkmanager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          test -x "$SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install Android API 36
        shell: bash
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build unsigned ScantoPDF release APK
        working-directory: scantopdf
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign ScantoPDF with existing release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scantopdf-release.jks"

          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" sign \
            --ks "$RUNNER_TEMP/scantopdf-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/ScantoPDF-Android-signed-release.apk" \
            scantopdf/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signature and package
        shell: bash
        run: |
          APK="$RUNNER_TEMP/ScantoPDF-Android-signed-release.apk"
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify --verbose --print-certs "$APK"

          certificate=$(java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify --print-certs "$APK" \
            | sed -n 's/.*SHA-1 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$certificate" = "235B9DD64A926CF7FCF78F791D33C738E9F7CCE7"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='vn.scantopdf.app'"

      - name: Prepare signed artifact
        shell: bash
        run: |
          mkdir -p signed-dist
          cp "$RUNNER_TEMP/ScantoPDF-Android-signed-release.apk" signed-dist/
          (cd signed-dist && sha256sum ScantoPDF-Android-signed-release.apk > SHA256SUMS.txt)

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScantoPDF-Android-signed-release
          path: signed-dist/
          if-no-files-found: error
          retention-days: 30
