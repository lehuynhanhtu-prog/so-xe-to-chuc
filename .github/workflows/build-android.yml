name: Build So Xe Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml', 'web/*.mjs']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build unsigned release for private signing
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Prepare signing tools
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-dist/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: So-Xe-To-Chuc-Android-4.8.0-native-unsigned
          path: android-dist/
          retention-days: 30
          if-no-files-found: error

  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          working-directory: android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-test-results
          path: android/app/build/outputs/androidTest-results/
