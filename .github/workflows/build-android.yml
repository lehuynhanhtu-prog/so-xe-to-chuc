name: Build So Xe Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml', 'web/*.mjs', 'tools/build-native-core.mjs']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build unsigned release for private signing
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Prepare signing tools
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-dist/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-dist/
      - name: Sign with the Android 4.7 release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/so-xe-release.jks"
          java -jar android-dist/apksigner.jar sign \
            --ks "$RUNNER_TEMP/so-xe-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out android-dist/So-Xe-To-Chuc-Android-4.8.3.apk \
            android-dist/app-release-unsigned.apk
          certificate=$(java -jar android-dist/apksigner.jar verify --print-certs android-dist/So-Xe-To-Chuc-Android-4.8.3.apk | sed -n 's/.*SHA-1 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$certificate" = "235B9DD64A926CF7FCF78F791D33C738E9F7CCE7"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-dist/So-Xe-To-Chuc-Android-4.8.3.apk | grep -F "versionName='4.8.3'"
          java -jar android-dist/apksigner.jar verify --verbose android-dist/So-Xe-To-Chuc-Android-4.8.3.apk
      - name: Publish signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=platform-v4.8.3
          apk=So-Xe-To-Chuc-Android-4.8.3.apk
          mkdir -p "$RUNNER_TEMP/platform-release"
          gh release download "$tag" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/platform-release"
          grep -vF "  $apk" "$RUNNER_TEMP/platform-release/SHA256SUMS.txt" > "$RUNNER_TEMP/platform-release/SHA256SUMS.new"
          (cd android-dist && sha256sum "$apk") >> "$RUNNER_TEMP/platform-release/SHA256SUMS.new"
          mv "$RUNNER_TEMP/platform-release/SHA256SUMS.new" "$RUNNER_TEMP/platform-release/SHA256SUMS.txt"
          gh release upload "$tag" "android-dist/$apk" "$RUNNER_TEMP/platform-release/SHA256SUMS.txt" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: So-Xe-To-Chuc-Android-4.8.3-native
          path: android-dist/
          retention-days: 30
          if-no-files-found: error

  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          working-directory: android
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb pull /sdcard/Pictures/SoXeNative/ native-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-test-results
          path: |
            android/app/build/outputs/androidTest-results/
            android/native-screenshots/
