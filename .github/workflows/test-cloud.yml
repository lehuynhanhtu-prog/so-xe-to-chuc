name: Test single-owner Apps Script
on:
  push:
    paths: ['apps-script-cloud/**', 'web/**', 'tools/**', 'tests/cloud*', 'package*.json', '.github/workflows/test-cloud.yml']
  pull_request:
    paths: ['apps-script-cloud/**', 'web/**', 'tools/**', 'tests/cloud*', 'package*.json', '.github/workflows/test-cloud.yml']
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cloud-ui
      - run: python3 tools/package-cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: So-Xe-Apps-Script-single-owner
          path: docs/downloads/*Apps-Script*cloud.1.zip
