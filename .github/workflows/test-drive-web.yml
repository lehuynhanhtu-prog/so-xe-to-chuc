name: Test Drive web app
on:
  push:
    paths: ['apps-script/**', 'tests/**', 'tools/**', 'package*.json', '.github/workflows/test-drive-web.yml']
  pull_request:
    paths: ['apps-script/**', 'tests/**', 'tools/**', 'package*.json', '.github/workflows/test-drive-web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:ui
