name: Build So Xe Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows-portable/**', 'docs/downloads/**', '.github/workflows/build-windows.yml', 'package.json', 'tools/package-platform-web.py']
permissions:
  contents: write
concurrency:
  group: platform-release
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build web package
        run: |
          npm ci
          npm run package:web
      - name: Compile portable launcher
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $source = (Resolve-Path "windows-portable\SoXeLauncher.cs").Path
          $output = Join-Path $PWD "windows-portable\SoXeLauncher.exe"
          & $csc /nologo /target:winexe /optimize+ /codepage:65001 /reference:System.Windows.Forms.dll "/out:$output" "$source"
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed' }
      - name: Package and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item docs/downloads/So-Xe-To-Chuc-Android-4.8.3.apk dist/
          Compress-Archive -Path windows-portable/SoXeLauncher.exe,windows-portable/Chay-So-Xe.bat,windows-portable/HUONG-DAN.txt -DestinationPath dist/So-Xe-To-Chuc-Windows-4.8.3.zip
          Copy-Item docs/downloads/So-Xe-iOS.mobileconfig dist/So-Xe-To-Chuc-iOS-4.8.3.mobileconfig
          Copy-Item docs/downloads/So-Xe-To-Chuc-Web-4.8.3.zip dist/
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
      - name: Publish platform downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'platform-v4.8.3'
          $assets = (Get-ChildItem dist -File).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --target '${{ github.sha }}' --title 'Sổ Xe Tổ Chức 4.8.3' --notes-file docs/release-4.8.3.md }
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: So-Xe-To-Chuc-Platforms-4.8.3
          path: dist/
          if-no-files-found: error
