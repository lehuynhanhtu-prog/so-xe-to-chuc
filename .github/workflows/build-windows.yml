name: Build So Xe Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows-portable/**', 'docs/downloads/**', '.github/workflows/build-windows.yml']
permissions:
  contents: write
concurrency:
  group: platform-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable launcher
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll /out:windows-portable/SoXeLauncher.exe windows-portable/SoXeLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed' }
      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path windows-portable/SoXeLauncher.exe,windows-portable/Chay-So-Xe.bat,windows-portable/HUONG-DAN.txt -DestinationPath dist/So-Xe-To-Chuc-Windows-4.6.0.zip
          Copy-Item docs/downloads/So-Xe-iOS.mobileconfig dist/So-Xe-To-Chuc-iOS-4.6.0.mobileconfig
          Copy-Item docs/downloads/So-Xe-To-Chuc-Web-4.6.0.zip dist/
          if (Test-Path docs/downloads/So-Xe-To-Chuc-Android-4.6.0.apk) {
            Copy-Item docs/downloads/So-Xe-To-Chuc-Android-4.6.0.apk dist/
          }
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
      - name: Publish platform downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'platform-v4.6.0'
          $assets = (Get-ChildItem dist -File).FullName
          if (gh release view $tag 2>$null) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title 'Sổ Xe Tổ Chức 4.6.0 — Android, Windows, iOS, Web' --notes 'Cùng chức năng và dữ liệu Drive. Windows Portable và APK Android mở Web trong trình duyệt hệ thống; iOS cài biểu tượng Web App bằng hồ sơ hoặc Safari. Cần Internet để đăng nhập và đồng bộ. Không yêu cầu cấu hình OAuth localhost.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: So-Xe-To-Chuc-Platforms-4.6.0
          path: dist/
          if-no-files-found: error
